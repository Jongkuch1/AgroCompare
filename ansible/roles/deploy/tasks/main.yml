---
- name: Clone or update the application repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    force: true
  register: app_checkout

- name: Build and start the application with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    build: "{{ 'always' if app_checkout.changed else 'policy' }}"
    state: present
