[app]
agrocompare-vm ansible_host=PRIVATE_VM_IP

[app:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/alu-devops
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ProxyCommand="ssh -i ~/.ssh/alu-devops -o StrictHostKeyChecking=accept-new -W %h:%p azureuser@BASTION_IP"'
